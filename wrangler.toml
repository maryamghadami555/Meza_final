name = "meza-accessory"
main = "worker/index.ts"
compatibility_date = "2025-09-01"

# Static frontend (built by `vite build` into ./dist). Only /api/* hits the Worker first.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "meza-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "meza-files"

[vars]
# آدرس عمومی سایت (برای لینک بازیابی رمز و بازگشت از درگاه)، مثلاً "https://shop.example.com"
PUBLIC_URL = ""
MAIL_FROM = ""
